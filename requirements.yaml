name: plantxbot-env
channels:
  - conda-forge
  - defaults

dependencies:
  # 1. Base System (Conda)
  - python=3.10
  - pip
  - sqlite  # Required for ChromaDB
  
  # 2. Python Libraries (Pip - Synced with your requirements.txt)
  - pip:
      # --- Core Web & API ---
      - Flask==3.1.0
      - flask-cors==5.0.1
      - Flask-Limiter==3.12
      - fastapi==0.115.9
      - uvicorn==0.34.2
      - requests==2.32.4
      - aiohttp==3.11.18
      - groq==0.23.0
      - openai==1.90.0

      # --- Data & Utilities ---
      - pandas==2.2.3
      - numpy==2.2.6
      - scipy==1.15.3
      - scikit-learn==1.6.1
      - python-dotenv==1.1.0
      - PyYAML==6.0.2
      - structlog==25.3.0
      - retry==0.9.2
      - cachetools==5.5.2
      - PyMySQL==1.1.1
      - sqlalchemy==2.0.40

      # --- AI, ML & Vector DB (Specific Versions) ---
      - torch==2.6.0
      - torchvision==0.21.0
      - transformers==4.53.1
      - sentence-transformers==4.1.0
      - accelerate==1.8.1
      - bitsandbytes==0.42.0
      - chromadb==1.0.8
      
      # --- LangChain Ecosystem ---
      - langchain==0.3.24
      - langchain-community==0.3.23
      - langchain-core==0.3.76
      - langchain-groq==0.3.2
      - langchain-huggingface==0.3.1
      - langchain-openai==0.3.24
      - langchain-google-genai==2.1.5
      - langchain-text-splitters==0.3.8

      # --- Bio / NLP / Parsing ---
      - biopython==1.85
      - spacy==3.8.5
      - nltk==3.9.1
      - beautifulsoup4==4.13.4
      - unstructured==0.18.2
      - pytesseract==0.3.13
      - pypdf==5.7.0
